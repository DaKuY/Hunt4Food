    <path d="M10 46 L2 38" stroke="#8dc63f" stroke-width="3"/>
  </g>

  <!-- Food -->
  <text x="236" y="78" fill="#5a9a4a" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="56">Food</text>

  <!-- Leaves on d -->
  <g fill="#5a9a4a">
    <path d="M438 24 C445 16, 456 16, 460 24 C455 27, 447 28, 438 24 Z"/>
    <path d="M450 18 C458 8, 472 10, 468 22 C463 24, 455 22, 450 18 Z"/>
