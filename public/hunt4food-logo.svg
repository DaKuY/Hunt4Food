  <path d="M6 62 V74" stroke="#1f4d2b" stroke-width="3" stroke-linecap="round"/>

  <!-- Arrow through Hunt -->
  <path d="M14 54 H132" stroke="#1f4d2b" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M132 54 L120 48 L120 60 Z" fill="#1f4d2b"/>
