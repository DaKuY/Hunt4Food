<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f3eb" />
    <meta
      name="description"
      content="Hunt4Food — hunt what’s good to eat nearby. Map a spot, pick cuisines, get ranked places that taste great (including healthier picks)."
    />
    <title>Hunt4Food · Restaurant Finder</title>
    <style>
      .topbar .base-camp-home {
        display: none !important;
      }

      .base-camp-footer-home {
        position: fixed;
        right: max(1rem, env(safe-area-inset-right));
        bottom: max(1rem, env(safe-area-inset-bottom));
        z-index: 100;
        display: inline-flex;
        align-items: center;
        width: auto;
        margin: 0;
        padding: 0.5rem;
        border: 1px solid rgba(28, 25, 23, 0.12);
        border-radius: 1rem;
        background: rgba(250, 248, 244, 0.94);
        box-shadow: 0 8px 24px rgba(28, 25, 23, 0.14);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        line-height: 0;
      }

      .base-camp-footer-home:focus-visible {
        outline: 2px solid #9a7b52;
        outline-offset: 3px;
      }

      .base-camp-footer-home img {
        display: block;
        width: auto;
        height: 2.5rem;
        max-width: min(160px, 42vw);
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <a class="base-camp-footer-home" href="https://andrewcamero.com/" aria-label="Back 2 Base Camp">
      <img src="/logos/7D1A58C5-AFB4-4707-9696-BC085F5048A5.png" alt="Back 2 Base Camp" />
    </a>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
