<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f3eb" />
    <meta
      name="description"
      content="Hunt4Food — hunt what’s good to eat nearby. Map a spot, pick cuisines, get ranked places that taste great (including healthier picks)."
    />
    <title>Hunt4Food · Restaurant Finder</title>
    <style>
      .topbar-brands {
        display: contents !important;
      }

      .topbar .top-brand {
        order: 1;
      }

      .topbar nav {
        order: 2;
        margin-left: auto;
        align-items: center;
      }

      .topbar .base-camp-home {
        display: inline-flex !important;
        order: 3;
        height: 2rem;
        max-width: 124px;
        margin-left: 0.35rem;
        flex: 0 0 auto;
      }

      .topbar .base-camp-home img {
        display: block;
        height: 100%;
        width: auto;
        max-width: 100%;
        object-fit: contain;
      }

      @media (max-width: 640px) {
        .topbar nav {
          gap: 0.45rem;
        }

        .topbar .base-camp-home {
          height: 1.7rem;
          max-width: 88px;
          margin-left: 0.15rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
